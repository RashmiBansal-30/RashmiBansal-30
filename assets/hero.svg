  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="card"><rect width="1000" height="320" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
