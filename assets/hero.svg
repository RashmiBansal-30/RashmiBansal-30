<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Rashmi Bansal - Frontend Developer, Cloud and Information Security" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0b24"/><stop offset="0.55" stop-color="#1b1850"/><stop offset="1" stop-color="#0d3a5c"/>
  </linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
